name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  STACK: accs-dev
  SITES: App Forums Schedule Cases Evaluations Records Admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The design system is a private repo in the org; npm fetches it over SSH with a read-only deploy key.
      - name: Design system access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DS_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stack outputs
        id: stack
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "api=$(out ApiUrl)" >> "$GITHUB_OUTPUT"
          echo "origins=$(out SiteOrigins)" >> "$GITHUB_OUTPUT"

      - run: npm run build
        env:
          VITE_API_URL: ${{ steps.stack.outputs.api }}/api
          VITE_SITE_ORIGINS: ${{ steps.stack.outputs.origins }}

      # Every site serves the same build. A site whose outputs are missing (stack not yet updated) is skipped.
      - name: Upload and invalidate
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          for p in $SITES; do
            bucket=$(out "${p}Bucket"); dist=$(out "${p}DistributionId"); url=$(out "${p}Url")
            if [ -z "$bucket" ] || [ "$bucket" = None ] || [ -z "$dist" ] || [ "$dist" = None ]; then
              echo "skip $p: stack outputs missing"; continue
            fi
            aws s3 sync dist "s3://$bucket" --delete
            aws cloudfront create-invalidation --distribution-id "$dist" --paths '/*' > /dev/null
            echo "Deployed $p to $url" >> "$GITHUB_STEP_SUMMARY"
          done
